# ============================================================
# mpv-advance 监控播放器 — input.conf
# 监控增强脚本(surveillance.lua)的按键绑定
# ============================================================

c            script-binding surveillance/cameras       # 打开摄像头列表（可搜索）→ 赋给当前画格
MENU         script-binding surveillance/menu          # 监控主菜单
\            script-binding surveillance/menu           # 监控主菜单（备用键）

g            script-binding surveillance/layout-cycle   # 循环切换布局 1→4→9
Ctrl+1       script-binding surveillance/layout-1       # 单画面
Ctrl+2       script-binding surveillance/layout-4       # 四分割
Ctrl+3       script-binding surveillance/layout-9       # 九分割

TAB          script-binding surveillance/next-slot      # 选中下一个画格
1            script-binding surveillance/slot-1         # 选中画格 1
2            script-binding surveillance/slot-2
3            script-binding surveillance/slot-3
4            script-binding surveillance/slot-4
5            script-binding surveillance/slot-5
6            script-binding surveillance/slot-6
7            script-binding surveillance/slot-7
8            script-binding surveillance/slot-8
9            script-binding surveillance/slot-9

l            script-binding surveillance/toggle-mode    # 实时 / 回放 切换
k            script-binding surveillance/playback-menu   # 时段回放菜单（预设/自定义/事件/AB循环）
K            script-binding surveillance/seek-menu       # 回放微调（相对/百分比跳转）
Ctrl+a       script-binding surveillance/autofill        # 自动填充所有画格
Ctrl+r       script-binding surveillance/refresh         # 刷新摄像头列表
DEL          script-binding surveillance/clear-slot      # 清空当前画格
Ctrl+DEL     script-binding surveillance/clear-all       # 全部清空
