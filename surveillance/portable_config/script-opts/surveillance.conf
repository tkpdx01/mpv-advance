# mpv-advance 监控脚本可配置项（script-opts）
# 本文件内的 key 不带 "surveillance-" 前缀；命令行 --script-opts 才需带前缀。
# 修改后重启 mpv 生效。

# 默认关闭 API，纯本地模式不需要 Python/curl，适合便携包与 Windows 7。
# 接入真实 API 或运行 mock_camera_api.py 后可改为 yes。
api_enabled=no

# V1 固定为单窗口单路播放；后续多窗口/多路版本再关闭此限制。
single_view=yes

# mock 摄像头 API 地址；启用后不可达时脚本自动回退读取本地 cameras.json
api_base=http://127.0.0.1:8777

# cameras.json 路径；留空=自动定位到 surveillance/data/cameras.json
data_file=

# 样本视频目录；留空=自动定位到仓库 test/samples
samples_dir=

# 网格合成画布尺寸与归一化帧率
canvas_w=1280
canvas_h=720
grid_fps=25

# 启动布局：1=单画面 4=四分割 9=九分割
default_layout=1

# 启动/切换布局时自动填充画格
autofill=yes

# API 请求超时（秒）
request_timeout=1.5

# 是否绘制画格覆盖层（编号/名称/状态/高亮）
overlay=yes
