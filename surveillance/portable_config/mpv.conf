# ============================================================
# mpv-advance 监控播放器 — mpv.conf
# ============================================================

# 常驻不退出：空闲启动保持窗口(idle) + 始终显示窗口(force-window) +
#   播放结束停在末帧而非退出(keep-open) + 文件结束暂停(keep-open-pause)
# 三者叠加保证：无论实时循环还是回放片段结束，播放器都保持常驻等待下一步操作。
idle=yes
force-window=yes
keep-open=yes
keep-open-pause=yes

# 实时模式循环样本以模拟“持续画面”；回放模式由脚本改为 loop-file=no
loop-file=inf

# 窗口与标题
title=mpv-advance 监控播放器 — ${?media-title:${media-title}}${!media-title:待命}
geometry=1280x720
autofit-larger=90%x90%

# 解码 / 输出
hwdec=auto-safe
# vo=gpu 可在 Win7 固定版 mpv 0.36 与新版 mpv 上共同工作。
vo=gpu
profile=fast

# OSC 保留（用于回放模式的进度/控制），我们的画格覆盖层与之并存
osc=yes
osd-bar=yes

# 屏幕消息字号
osd-font-size=30
